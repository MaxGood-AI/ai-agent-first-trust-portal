# Single-host production stack: the production image plus PostgreSQL 17.
# Put a TLS-terminating reverse proxy in front of port 5100 (session cookies are
# Secure in production). Required in .env: SECRET_KEY, POSTGRES_PASSWORD.
services:
  trust-portal:
    build: .
    container_name: trust-portal
    ports:
      - "${PORT:-5100}:5100"
    env_file:
      - .env
    environment:
      - PORTAL_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trust_portal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trust_portal}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: public.ecr.aws/docker/library/postgres:17
    container_name: trust-portal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trust_portal}
      POSTGRES_USER: ${POSTGRES_USER:-trust_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trust_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
